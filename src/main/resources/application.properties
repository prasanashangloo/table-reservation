server.port=${SERVER_PORT:8080}

# Parameterised environment setting (Task 8): dev | staging | prod
app.environment=${APP_ENV:dev}
app.version=@project.version@

# Default database: in-memory H2 (zero setup). Use --spring.profiles.active=mysql for MySQL.
spring.datasource.url=jdbc:h2:mem:reservations;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
