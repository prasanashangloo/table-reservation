# Task 13 - Configuration management: prerequisites for the target node
# (packages, users, folders, files, ports and services). Safe to run repeatedly (idempotent).
- name: Provision reservation server
  hosts: reservation_servers
  become: true
  vars_files:
    - group_vars_all.yml

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ required_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create application group
      ansible.builtin.group:
        name: "{{ app_group }}"
        state: present

    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present
        system: true

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        groups: docker
        append: true
        shell: /usr/sbin/nologin
        system: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Write environment file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/app.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0640"
        content: |
          APP_ENV={{ app_env }}
          SERVER_PORT={{ container_port }}

    - name: Check the Docker engine is reachable (provided by Docker Desktop in WSL)
      ansible.builtin.command: docker info
      register: docker_info
      changed_when: false

    - name: Open the application port in ufw (rule is stored even if ufw is not enabled yet)
      community.general.ufw:
        rule: allow
        port: "{{ host_port }}"
        proto: tcp
