# Task 14 - Deploy the container, health-check it, and roll back automatically on failure.
# Usage:  ansible-playbook -i inventory.ini deploy.yml -K -e image_tag=9
- name: Deploy reservation container with automatic rollback
  hosts: reservation_servers
  become: true
  vars_files:
    - group_vars_all.yml

  tasks:
    - name: Read currently deployed tag (if any)
      ansible.builtin.slurp:
        src: "{{ app_dir }}/current_tag"
      register: current_tag_file
      failed_when: false

    - name: Remember previous stable tag
      ansible.builtin.set_fact:
        previous_tag: "{{ (current_tag_file.content | b64decode | trim) if current_tag_file.content is defined else '' }}"

    - name: Deploy new release with health gate
      block:
        - name: Pull and run requested image
          community.docker.docker_container:
            name: "{{ container_name }}"
            image: "{{ image_repo }}:{{ image_tag }}"
            state: started
            restart_policy: unless-stopped
            image_name_mismatch: recreate
            pull: true
            env_file: "{{ app_dir }}/app.env"
            published_ports:
              - "{{ host_port }}:{{ container_port }}"

        - name: Health check (retries while the app starts)
          ansible.builtin.uri:
            url: "{{ health_url }}"
            return_content: true
          register: health
          until: health.status == 200 and 'UP' in health.content
          retries: 15
          delay: 4

        - name: Keep the previous stable tag for manual rollback
          ansible.builtin.copy:
            dest: "{{ app_dir }}/previous_tag"
            content: "{{ previous_tag }}\n"
            mode: "0644"
          when: previous_tag | length > 0 and previous_tag != image_tag

        - name: Record this tag as the current stable release
          ansible.builtin.copy:
            dest: "{{ app_dir }}/current_tag"
            content: "{{ image_tag }}\n"
            mode: "0644"

      rescue:
        - name: Roll back to previous stable release
          community.docker.docker_container:
            name: "{{ container_name }}"
            image: "{{ image_repo }}:{{ previous_tag }}"
            state: started
            restart_policy: unless-stopped
            image_name_mismatch: recreate
            env_file: "{{ app_dir }}/app.env"
            published_ports:
              - "{{ host_port }}:{{ container_port }}"
          when: previous_tag | length > 0

        - name: Fail the play so the pipeline sees the failed release
          ansible.builtin.fail:
            msg: "Release {{ image_tag }} failed its health check; rolled back to '{{ previous_tag }}'."
