# Task 14 - Manual recovery to the previous stable release (reads /opt/reservation/previous_tag).
- name: Manual rollback
  hosts: reservation_servers
  become: true
  vars_files:
    - group_vars_all.yml

  tasks:
    - name: Read previous tag
      ansible.builtin.slurp:
        src: "{{ app_dir }}/previous_tag"
      register: prev

    - name: Run previous release
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_repo }}:{{ prev.content | b64decode | trim }}"
        state: started
        restart_policy: unless-stopped
        image_name_mismatch: recreate
        env_file: "{{ app_dir }}/app.env"
        published_ports:
          - "{{ host_port }}:{{ container_port }}"

    - name: Health check after rollback
      ansible.builtin.uri:
        url: "{{ health_url }}"
      register: health
      until: health.status == 200
      retries: 15
      delay: 4

    - name: Record the restored tag as the current stable release
      ansible.builtin.copy:
        dest: "{{ app_dir }}/current_tag"
        content: "{{ prev.content | b64decode | trim }}\n"
        mode: "0644"
